# Hugo configuration file
title: Documentation

theme: hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Website
      pageRef: /website/
      weight: 1
    - name: API
      pageRef: /api/
      weight: 2
    - name: MCP
      pageRef: /mcp/
      weight: 3
    - name: About
      pageRef: /about/
      weight: 4
    - name: fanta.bio ↗
      url: "https://fanta.bio"
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 60
      height: 22
      link: /

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/fanta-bio/docs/edit/main/content"

services:
  googleAnalytics:
    ID: G-J9PSH6BNLB
